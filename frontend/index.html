<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buscador de productos</title>
    <link rel="stylesheet" href="./css/styles.css">
    <!-- <script src="./js/components/ProductCard.js"></script> -->
    <script type="module" src="./js/main.js"></script>
</head>

<body>

    <div class="titles">
        <h1>El mejor buscador y comparador de precios de supermercados</h1>
        <h2>Encontrá productos de los siguientes súpers: <span class="titles__supermarkets"></span></h2>
    </div>

    <nav class="navbar">
        <form action="" method="GET">
            <input type="search" name="q" placeholder="Buscar..." class="navbar__input">
            <button type="submit" class="navbar__submit">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                    class="icon icon-tabler icons-tabler-outline icon-tabler-search">
                    <path stroke="none" d="M0 0h24v24H0z" fill="none" />
                    <path d="M10 10m-7 0a7 7 0 1 0 14 0a7 7 0 1 0 -14 0" />
                    <path d="M21 21l-6 -6" />
                </svg>
            </button>
        </form>
    </nav>

    <section class="search__filters">
        <p><span id="amt-products-found">0</span> productos encontrados</p>

        <div class="search__filters--items">
            <div class="search__filters--offers">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"
                    class="icon icon-tabler icons-tabler-outline icon-tabler-rosette-discount">
                    <path stroke="none" d="M0 0h24v24H0z" fill="none" />
                    <path d="M9 15l6 -6" />
                    <circle cx="9.5" cy="9.5" r=".5" fill="currentColor" />
                    <circle cx="14.5" cy="14.5" r=".5" fill="currentColor" />
                    <path
                        d="M5 7.2a2.2 2.2 0 0 1 2.2 -2.2h1a2.2 2.2 0 0 0 1.55 -.64l.7 -.7a2.2 2.2 0 0 1 3.12 0l.7 .7a2.2 2.2 0 0 0 1.55 .64h1a2.2 2.2 0 0 1 2.2 2.2v1a2.2 2.2 0 0 0 .64 1.55l.7 .7a2.2 2.2 0 0 1 0 3.12l-.7 .7a2.2 2.2 0 0 0 -.64 1.55v1a2.2 2.2 0 0 1 -2.2 2.2h-1a2.2 2.2 0 0 0 -1.55 .64l-.7 .7a2.2 2.2 0 0 1 -3.12 0l-.7 -.7a2.2 2.2 0 0 0 -1.55 -.64h-1a2.2 2.2 0 0 1 -2.2 -2.2v-1a2.2 2.2 0 0 0 -.64 -1.55l-.7 -.7a2.2 2.2 0 0 1 0 -3.12l.7 -.7a2.2 2.2 0 0 0 .64 -1.55v-1" />
                </svg>
                <label for="checkbox-offers">Solo en oferta</label>
                <input type="checkbox" id="checkbox-offers">
            </div>

            <div class="search__filters--sort">
                <div class="search__filters--sort-text">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"
                        class="icon icon-tabler icons-tabler-outline icon-tabler-arrows-sort">
                        <path stroke="none" d="M0 0h24v24H0z" fill="none" />
                        <path d="M3 9l4 -4l4 4m-4 -4v14" />
                        <path d="M21 15l-4 4l-4 -4m4 4v-14" />
                    </svg>
                    <span>Ordenar por</span>
                </div>
                <select name="select-sort">
                    <option value="OrderByNameASC">Nombre A-Z</option>
                    <option value="OrderByNameDESC">Nombre Z-A</option>
                    <option value="OrderByPriceASC" selected>Precio más bajo</option>
                    <option value="OrderByPriceDESC">Precio más alto</option>
                </select>
            </div>
        </div>
    </section>

    <div class="container__btn-previous-products">
        <button type="button" id="btn-previous-products">Mostrar anteriores</button>
    </div>
    <main class="products">
        <!-- Acá van los productos de la búsqueda -->
    </main>


    <!-- Boton para abrir carrito de compras -->
    <div class="container__btn-cart">
        <button type="button" id="btn-cart" title="Carrito de compras">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"
                class="icon icon-tabler icons-tabler-outline icon-tabler-shopping-cart">
                <path stroke="none" d="M0 0h24v24H0z" fill="none" />
                <path d="M6 19m-2 0a2 2 0 1 0 4 0a2 2 0 1 0 -4 0" />
                <path d="M17 19m-2 0a2 2 0 1 0 4 0a2 2 0 1 0 -4 0" />
                <path d="M17 17h-11v-14h-2" />
                <path d="M6 5l14 1l-1 7h-13" />
            </svg>
        </button>
    </div>

    <!-- Carrito de compras -->
    <aside class="cart">
        <header class="cart__header">
            <h3>Carrito de compras</h3>
            <button type="button" id="btn-cart-close" title="Cerrar el carrito de compras">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"
                    class="icon icon-tabler icons-tabler-outline icon-tabler-x">
                    <path stroke="none" d="M0 0h24v24H0z" fill="none" />
                    <path d="M18 6l-12 12" />
                    <path d="M6 6l12 12" />
                </svg>
            </button>
        </header>
        <section class="cart__products">
            <!-- Acá van los productos del carrito -->
        </section>
        <footer class="cart__resume">
            <div class="cart__resume--total">
                <span>Total: </span>
                <span id="cart-total-price">$0,00</span>
            </div>
        </footer>
    </aside>

    <!-- Boton para subir -->
    <div class="container__btn-top">
        <button type="button" id="btn-to-top">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"
                class="icon icon-tabler icons-tabler-outline icon-tabler-arrow-up">
                <path stroke="none" d="M0 0h24v24H0z" fill="none" />
                <path d="M12 5l0 14" />
                <path d="M18 11l-6 -6" />
                <path d="M6 11l6 -6" />
            </svg>
        </button>
    </div>

</body>

</html>
