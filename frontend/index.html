<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buscador de productos</title>
    <link rel="stylesheet" href="./css/styles.css">
    <!-- <script src="./js/components/ProductCard.js"></script> -->
    <script type="module" src="./js/main.js"></script>
</head>

<body>

    <div class="titles">
        <h1>El mejor buscador y comparador de precios de supermercados</h1>
        <h2>Encontrá productos de los siguientes súpers: <span class="titles__supermarkets"></span></h2>
    </div>

    <nav class="navbar">
        <form action="" method="GET">
            <input type="search" name="q" placeholder="Buscar..." class="navbar__input">
            <button type="submit" class="navbar__submit">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                    class="icon icon-tabler icons-tabler-outline icon-tabler-search">
                    <path stroke="none" d="M0 0h24v24H0z" fill="none" />
                    <path d="M10 10m-7 0a7 7 0 1 0 14 0a7 7 0 1 0 -14 0" />
                    <path d="M21 21l-6 -6" />
                </svg>
            </button>
        </form>
    </nav>

    <section class="search__filters">
        <p><span id="amt-products-found">0</span> productos encontrados</p>
        <div class="search__filters--sort">
            <span>Ordenar por</span>
            <select name="select-sort">
                <option value="OrderByNameASC">Nombre A-Z</option>
                <option value="OrderByNameDESC">Nombre Z-A</option>
                <option value="OrderByPriceASC" selected>Precio más bajo</option>
                <option value="OrderByPriceDESC">Precio más alto</option>
            </select>
        </div>
    </section>

    <div class="container__btn-previous-products">
        <button type="button" id="btn-previous-products">Mostrar anteriores</button>
    </div>
    <main class="products">
        <!-- Acá van los productos de la búsqueda -->
    </main>


    <!-- Boton para abrir carrito de compras -->
    <div class="container__btn-cart">
        <button type="button" id="btn-cart">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"
                class="icon icon-tabler icons-tabler-outline icon-tabler-shopping-cart">
                <path stroke="none" d="M0 0h24v24H0z" fill="none" />
                <path d="M6 19m-2 0a2 2 0 1 0 4 0a2 2 0 1 0 -4 0" />
                <path d="M17 19m-2 0a2 2 0 1 0 4 0a2 2 0 1 0 -4 0" />
                <path d="M17 17h-11v-14h-2" />
                <path d="M6 5l14 1l-1 7h-13" />
            </svg>
        </button>
    </div>

    <!-- Carrito de compras -->
    <aside class="cart">
        <header class="cart__header">
            <h3>Carrito de compras</h3>
            <button type="button" id="btn-cart-close">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"
                    class="icon icon-tabler icons-tabler-outline icon-tabler-x">
                    <path stroke="none" d="M0 0h24v24H0z" fill="none" />
                    <path d="M18 6l-12 12" />
                    <path d="M6 6l12 12" />
                </svg>
            </button>
        </header>
        <section class="cart__products">
            <!-- Acá van los productos del carrito -->
        </section>
        <footer class="cart__resume">
            <div class="cart__resume--total">
                <span>Total: </span>
                <span id="cart-total-price">$0,00</span>
            </div>
        </footer>
    </aside>

    <!-- Boton para subir -->
    <div class="container__btn-top">
        <button type="button" id="btn-to-top">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="currentColor"
                class="icon icon-tabler icons-tabler-filled icon-tabler-caret-up">
                <path stroke="none" d="M0 0h24v24H0z" fill="none" />
                <path
                    d="M11.293 7.293a1 1 0 0 1 1.32 -.083l.094 .083l6 6l.083 .094l.054 .077l.054 .096l.017 .036l.027 .067l.032 .108l.01 .053l.01 .06l.004 .057l.002 .059l-.002 .059l-.005 .058l-.009 .06l-.01 .052l-.032 .108l-.027 .067l-.07 .132l-.065 .09l-.073 .081l-.094 .083l-.077 .054l-.096 .054l-.036 .017l-.067 .027l-.108 .032l-.053 .01l-.06 .01l-.057 .004l-.059 .002h-12c-.852 0 -1.297 -.986 -.783 -1.623l.076 -.084l6 -6z" />
            </svg>
        </button>
    </div>

</body>

</html>
